[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "click",
    "rich",
    "tqdm",
    "send2trash",
    "psutil>=5.9.0",
    "python-magic>=0.4.27",
    "PyExifTool>=0.5.0",
    "mutagen>=1.47.0",
    "py-cpuinfo>=9.0.0",
    "defusedxml>=0.7.1",
    "pydantic>=2",
    "msgpack>=1.0.0",
    "platformdirs>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
# GUI/media/forensics backends are optional: the `fm` CLI console script only
# needs the core dependencies above. Install extras (or requirements.txt)
# for full desktop/media support.
gui = ["PyQt5>=5.15.0"]
media = ["Pillow>=10.0.0", "pypdf>=6.14.2", "pymupdf>=1.28.0", "opencv-python-headless>=5.0.0.93", "pandas>=2.2.3"]
forensics = ["psutil>=5.9.0", "python-magic>=0.4.27", "PyExifTool>=0.5.0", "mutagen>=1.47.0"]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "mypy", "pre-commit", "pip-audit", "pyinstaller"]

[project.scripts]
fm = "dataforge.cli:main"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F) plus ambiguous-name checks.
select = ["E4", "E7", "E9", "F", "E741"]
ignore = [
    "E701",  # multiple statements on one line (colon) - compact guard clauses
    "E702",  # multiple statements on one line (semicolon) - same convention
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their public API; the imports are the API.
"dataforge/core/__init__.py" = ["F401"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
# No python_version pin: mypy's syntax parser gates PEP 695 constructs
# (e.g. numpy's bundled stubs) on this setting, but doesn't re-enforce
# older f-string grammar restrictions from it either (ruff's
# target-version covers that class of bug instead) - so pinning here
# only costs us stub compatibility for no added safety.
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^build/", "^dist/", "^buildspec/"]

[tool.coverage.run]
source = ["dataforge"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
